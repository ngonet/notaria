name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Lint and typecheck
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify no API keys in dist
        run: |
          # The Firebase web apiKey (AIzaSyAn2A...) is public by design and is
          # required in the client bundle for App Check. Allowlist it and fail on
          # any other AIzaSy-prefixed key (e.g. the GOOGLE_CALENDAR_API_KEY secret).
          leaked=$(rg -o 'AIzaSy[0-9A-Za-z_-]+' dist/ | sort -u \
            | grep -vF 'AIzaSyAn2A233ZY1y6C85uJvntgZFbENmWGg9C0' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Non-allowlisted Google API key leaked into dist/"
            echo "$leaked"
            exit 1
          fi

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTARIA_MELIPILLA }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx -y firebase-tools@latest deploy \
            --only hosting,functions \
            --project notaria-melipilla \
            --non-interactive \
            --force
