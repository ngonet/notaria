name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
  # Sent by notaria-documentos after it deploys, to refresh /documentos/.
  repository_dispatch:
    types: [documentos-updated]
# A push to main and a documentos-updated dispatch must not deploy at the same time.
concurrency:
  group: deploy-hosting
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Test functions
        run: npm --prefix functions test

      - name: Lint and typecheck
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Build public forms (notaria-documentos)
        uses: actions/checkout@v4
        with:
          repository: ngonet/notaria-documentos
          ref: main
          path: notaria-documentos
          ssh-key: ${{ secrets.NOTARIA_DOCUMENTOS_DEPLOY_KEY }}
          # The deploy key is only needed to clone; keep it off disk while pnpm runs install scripts.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: notaria-documentos/package.json

      - name: Copy public forms to dist/documentos
        working-directory: notaria-documentos
        run: |
          # Login-free forms served at /documentos/; wording comes from
          # /api/documentos/plantillas (publishedTemplates).
          pnpm install --frozen-lockfile
          pnpm build:public
          rm -rf ../dist/documentos
          cp -r dist-public ../dist/documentos

      - name: Verify no API keys in dist
        run: |
          # The Firebase web apiKey (AIzaSyAn2A...) is public by design and is
          # required in the client bundle for App Check. Allowlist it and fail on
          # any other AIzaSy-prefixed key (e.g. the GOOGLE_CALENDAR_API_KEY secret).
          leaked=$(rg -o 'AIzaSy[0-9A-Za-z_-]+' dist/ | sort -u \
            | grep -vF 'AIzaSyAn2A233ZY1y6C85uJvntgZFbENmWGg9C0' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Non-allowlisted Google API key leaked into dist/"
            echo "$leaked"
            exit 1
          fi

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NOTARIA_MELIPILLA }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # Pinned so a re-run against an older commit uses the same deploy tool.
          # --force is required for unattended CI: without it, removing a function
          # prompts for confirmation, which --non-interactive then fails on.
          npx -y firebase-tools@15.32.1 deploy \
            --only hosting,functions \
            --project notaria-melipilla \
            --non-interactive \
            --force
